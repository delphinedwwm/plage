<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajout d'une réservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<h1>Ajout d'une réservation</h1>
<form action="reservation" th:object="${reservation}" method="post">
    <label for="parasols">Parasol(s)</label>
    <select th:field="*{parasols}" id="parasols" multiple="multiple" class="form-control">
        <option th:each="parasol:${parasols}" th:value="${parasol.id}" th:text="${parasol.nomComplet}"></option>
    </select>
    <span th:if="${#fields.hasErrors('parasols')}" th:errorclass="erreur" th:errors="*{parasols}"></span>
    <br>
    <span th:if="${errorMessage!=null}"><br><p class="alert alert-danger" th:text="${errorMessage}"/></span>
    <br>
    <label for="dateDebut">Date de début</label>
    <input id="dateDebut" type="date" name="dateDebut" th:field="*{dateDebut}">
    <span th:if="${#fields.hasErrors('dateDebut')}" th:errorclass="erreur" th:errors="*{dateDebut}"></span>
    <br>
    <label for="dateFin">Date de fin</label>
    <input id="dateFin" type="date" name="dateFin" th:field="*{dateFin}">
    <br>
    <input type="submit" value="Ajouter">
</form>
</body>
</html>
